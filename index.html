        <body>
        <h1>Subtransit</h1>
        <h2>A game about escaping the subway</h2>
        <ul>
            <li>WASD keys to move</li>
            <li>Move the mouse to look around</li>
            <li>Left Click to shoot and right click to alternate fire</li>
            <li>Press "E" to interact with things</li>
            <li>Press "R" to reload your weapon</li>
            <li>Press ESC to open the menu</li>
        </ul>
